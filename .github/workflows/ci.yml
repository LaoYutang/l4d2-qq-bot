name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen l4d2-qq-bot validate --config config.example.json
      - run: uv run --frozen l4d2-qq-bot demo --event examples/group_event.json --output artifacts/demo
      - run: uv build --no-sources

  docker-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: l4d2-qq-bot:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - run: docker run --rm l4d2-qq-bot:ci validate --config config.example.json
      - run: docker run --rm l4d2-qq-bot:ci demo --output /tmp/l4d2-demo
