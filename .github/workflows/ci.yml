name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Resolve Chinese font package
        id: font-package
        timeout-minutes: 3
        run: python3 .github/scripts/chinese_font_cache.py prepare
      - name: Cache Chinese font package
        uses: actions/cache@v5
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ${{ steps.font-package.outputs.cache-path }}
          key: ${{ steps.font-package.outputs.cache-key }}
      - name: Install Chinese font
        timeout-minutes: 8
        run: python3 .github/scripts/chinese_font_cache.py install
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen l4d2-qq-bot validate --config config.example.json
      - run: uv run --frozen l4d2-qq-bot demo --event examples/group_event.json --output artifacts/demo
      - run: uv build --no-sources

  docker-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: l4d2-qq-bot:ci
          build-args: VERSION=v0.0.0
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: Verify built version
        run: test "$(docker run --rm l4d2-qq-bot:ci --version)" = "0.0.0"
      - run: docker run --rm l4d2-qq-bot:ci validate --config config.example.json
      - run: docker run --rm l4d2-qq-bot:ci demo --output /tmp/l4d2-demo
