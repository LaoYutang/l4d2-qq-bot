name: Publish tag image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Validate semantic tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --frozen python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          from packaging.version import Version
          from l4d2_qq_bot import __version__

          tag = os.environ["RELEASE_TAG"]
          pattern = r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(alpha|beta|rc)\.(0|[1-9]\d*))?"
          if not re.fullmatch(pattern, tag):
              raise SystemExit("Use v1.2.3 or v1.2.3-rc.1 format")
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if Version(tag[1:]) != Version(project["version"]) or Version(tag[1:]) != Version(__version__):
              raise SystemExit("Tag, pyproject.toml and package versions must match")
          PY

  publish:
    runs-on: ubuntu-24.04
    needs: [checks, validate-tag]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Normalize registry path
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true
