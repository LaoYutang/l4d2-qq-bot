name: Publish tag image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen l4d2-qq-bot validate --config config.example.json
      - run: uv run --frozen l4d2-qq-bot demo --event examples/group_event.json --output artifacts/demo
      - run: uv build --no-sources

  docker-smoke:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: l4d2-qq-bot:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - run: docker run --rm l4d2-qq-bot:ci validate --config config.example.json
      - run: docker run --rm l4d2-qq-bot:ci demo --output /tmp/l4d2-demo

  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          pattern = r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(alpha|beta|rc)\.(0|[1-9]\d*))?"
          if not re.fullmatch(pattern, tag):
              raise SystemExit("发布 tag 格式无效，请使用 v1.2.3 或 v1.2.3-rc.1")
          PY

  publish:
    runs-on: ubuntu-24.04
    needs: [checks, docker-smoke, validate-tag]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: laoyutang/l4d2-qq-bot
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true
